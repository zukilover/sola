name: Publish

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish
        required: true
        type: string

jobs:
  publish:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag || github.event.workflow_run.head_sha }}

      - name: Checkout the release tag
        if: github.event_name == 'workflow_run'
        run: |
          git fetch --tags --force
          git checkout "$(git describe --tags --abbrev=0 --match 'v[0-9]*')"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@^11.5.1
      - run: npm ci

      - name: Match git tag to package.json
        run: |
          git fetch --tags --force
          TAG="$(git describe --tags --exact-match HEAD)"
          TAG="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG"

      - name: Publish to npm
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER is already on npm"
            exit 0
          fi
          npm publish --provenance --access public
